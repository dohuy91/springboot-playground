spring.application.name=springboot-playground
spring.datasource.url=jdbc:postgresql://localhost:6432/playground
spring.datasource.username=playground
spring.datasource.password=playground
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=product-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka message storage: ALL stores every message outcome, FAILED_ONLY stores only failures
app.kafka.storage-mode=FAILED_ONLY
app.kafka.retry.max-retries=3
app.kafka.retry.backoff-seconds=30

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/master
